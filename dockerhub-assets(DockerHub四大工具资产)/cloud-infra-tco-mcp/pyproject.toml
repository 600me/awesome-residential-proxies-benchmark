[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-infra-tco-mcp"
version = "1.0.1"
description = "Official Model Context Protocol (MCP) server & CLI for 2026 developer cloud infrastructure, GPU, proxy, scraping, and PDF TCO benchmarking"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "CloudBench Research", email = "research@cloudbench.labs" }]
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "cloud-cost", "gpu-pricing", "proxy-benchmark", "tco-calculator", "developer-tools"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.scripts]
cloud-infra-tco-mcp = "cloud_infra_tco_mcp.server:main"

[project.urls]
Homepage = "https://cloud-infra-tco-benchmarks.readthedocs.io/en/latest/"
Documentation = "https://cloud-infra-tco-benchmarks.readthedocs.io/en/latest/"
Repository = "https://github.com/cloudbench-labs/cloud-infra-tco-mcp"
