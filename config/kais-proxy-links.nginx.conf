# kais-proxy-links -- affiliate short-link relay for go.272738.xyz
# Deployed to: us-server:/etc/nginx/sites-available/kais-proxy-links
# Loaded via `include /etc/nginx/sites-enabled/*;` inside the http {} block of
# /etc/nginx/nginx.conf, therefore the map block below is legal here (map is
# http-context only and must stay outside the server blocks).

# Sanitized attribution token. Only [A-Za-z0-9_.-]{1,64} may ever reach a
# vendor, which blocks CRLF / header-injection and arbitrary query smuggling.
# Priority: ?src= > ?utm_content= > ?utm_source=; nothing usable => "direct".
map "$arg_src:$arg_utm_content:$arg_utm_source" $raw_subid {
    default "direct";
    "~^([A-Za-z0-9_.-]{1,64}):" $1;
    "~^:([A-Za-z0-9_.-]{1,64}):" $1;
    "~^::([A-Za-z0-9_.-]{1,64})$" $1;
}

server {
    listen 80;
    server_name go.272738.xyz;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name go.272738.xyz;
    ssl_certificate /etc/letsencrypt/live/go.272738.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/go.272738.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location = /smartproxy { add_header Referrer-Policy no-referrer always; add_header Cache-Control "no-store" always; return 302 "https://visit.decodo.com/k434W0?subId1=$raw_subid"; }
    location = /brightdata { return 301 "https://brightdata.com/?utm_source=github&utm_campaign=proxy_benchmark"; }
    location = /apify { return 301 "https://apify.com/?utm_source=github&utm_campaign=proxy_benchmark"; }
    location = /oxylabs { return 301 "https://oxylabs.io/?utm_source=github&utm_campaign=proxy_benchmark"; }
    location = /runpod { return 302 "https://www.runpod.io/?ref=zzhi58ly&utm_source=github&utm_campaign=gpu_benchmark&utm_content=$raw_subid"; }
    location = /vastai { return 302 "https://cloud.vast.ai/?ref_id=748114&utm_source=github&utm_campaign=gpu_benchmark&utm_content=$raw_subid"; }
    location = /together { return 302 "https://www.together.ai/?utm_source=github&utm_campaign=gpu_benchmark"; }
    location = /openrouter { return 302 "https://openrouter.ai/?utm_source=github&utm_campaign=gpu_benchmark"; }
    location = /deepinfra { return 302 "https://deepinfra.com/?utm_source=github&utm_campaign=gpu_benchmark"; }
    location = /doola { return 302 "https://www.doola.com/?utm_source=github&utm_campaign=payments_matrix"; }
    location = /firstbase { return 302 "https://get.firstbase.io/slcdxtscxrh7?utm_content=$raw_subid"; }
    location = /lemonsqueezy { return 302 "https://www.lemonsqueezy.com/?utm_source=github&utm_campaign=payments_matrix"; }
    location = /paddle { return 302 "https://www.paddle.com/?utm_source=github&utm_campaign=payments_matrix"; }
    location = /wise { return 302 "https://wise.com/us/business/?utm_source=github&utm_campaign=payments_matrix"; }
    access_log /var/log/nginx/affiliate_relay.log relay_fmt;
    add_header Referrer-Policy no-referrer always;
    location = / { return 301 https://proxy.mybskm.top/; }
    location / { return 404; }
    location = /zenrows { return 302 "https://www.zenrows.com/?utm_source=github&utm_campaign=scraping_benchmark"; }
    location = /scrapingbee { return 302 "https://www.scrapingbee.com/?utm_source=github&utm_campaign=scraping_benchmark"; }
    location = /scraperapi { add_header Cache-Control "no-store" always; return 302 "https://www.scraperapi.com/?fp_ref=kais-08a45e&fp_sid=$raw_subid&utm_source=github&utm_campaign=scraping_benchmark&utm_content=$raw_subid"; }
    location = /airalo { return 302 "https://www.airalo.com/?utm_source=esimmatrix"; }
    location = /yesim { return 302 "https://yesim.app/?utm_source=esimmatrix"; }
    location = /saily { return 302 "https://saily.com/?utm_source=esimmatrix"; }
    location = /nomad { return 302 "https://www.getnomad.app/?utm_source=esimmatrix"; }
    location = /crawlbase { return 302 "https://crawlbase.com/?utm_source=github&utm_campaign=scraping_benchmark"; }
}
