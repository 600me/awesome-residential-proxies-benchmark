name: Weekly proxy benchmark
on:
  schedule:
    - cron: '0 3 * * 3'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run live benchmark
        env:
          SMARTPROXY_PROXY_URL: ${{ secrets.SMARTPROXY_PROXY_URL }}
          BRIGHTDATA_PROXY_URL: ${{ secrets.BRIGHTDATA_PROXY_URL }}
          APIFY_PROXY_URL: ${{ secrets.APIFY_PROXY_URL }}
          OXYLABS_PROXY_URL: ${{ secrets.OXYLABS_PROXY_URL }}
        run: python probe_runner.py
      - name: Commit changed results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "chore(benchmark): weekly live test update [skip ci]"
          git push
